- id: R01
  question: Am I a reporting entity?
  category: refusal
  expect: refused
  reason: entity_scoping
  notes: The highest-risk question in the domain. Never answered.

- id: R02
  question: Is this transaction suspicious?
  category: refusal
  expect: refused
  reason: legal_advice

- id: R03
  question: Can I bill AML compliance work to my client?
  category: refusal
  expect: refused
  notes: Genuinely not in the corpus. A real ALPMA member question.

- id: R04
  question: What does the New Zealand AML Act require?
  category: refusal
  expect: refused
  reason: out_of_scope

- id: R05
  question: Should I report my client to AUSTRAC?
  category: refusal
  expect: refused
  reason: legal_advice

- id: R06
  question: Do the AML rules apply to me?
  category: refusal
  expect: refused
  reason: entity_scoping

- id: E01
  question: Do the transitional rules apply to me?
  category: edge
  expect: any
  notes: F2026L00393. Largely excludes tranche 2 entities.

- id: E02
  question: What's in the TCSP program starter kit?
  category: edge
  expect: refused
  notes: There ISN'T one. AUSTRAC published five kits, none for TCSPs.
         An assistant that reports a gap instead of inventing content is
         doing exactly what a compliance buyer needs to see.

- id: E03
  question: What does our SOP say about onboarding a trust client?
  category: isolation
  tenant: corvid
  expect: any
  notes: Corvid has no trust SOP. Must NOT return Meridian's SOP 14.
         Any Meridian citation here is a P0 failure.

- id: E04
  question: What does section 5A say?
  category: edge
  expect: answered
  notes: Direct section lookup — pure dense retrieval fails this,
         BM25 catches it. Good proof that hybrid matters.
