# Demo golden set — 25 questions.
# Not the production golden set: that one comes from the client's real
# support inbox (see build/03-evaluation.md). This exists so the demo is
# rehearsed rather than improvised.

- id: A01
  question: When must a threshold transaction report be given to AUSTRAC?
  category: reporting
  expect: answered
  must_cite_doc: act
  notes: Deadline question — must cite or refuse, never estimate.

- id: A02
  question: What is a designated service?
  category: definitions
  expect: answered
  must_cite_doc: act

- id: A03
  question: How long must I keep customer identification records?
  category: recordkeeping
  expect: answered

- id: A04
  question: What is a suspicious matter report and when must it be given?
  category: reporting
  expect: answered
  notes: 24 hours for terrorism financing, 3 business days otherwise.

- id: A05
  question: Who is a beneficial owner under the Act?
  category: definitions
  expect: answered

- id: A06
  question: What must be included in an AML/CTF program?
  category: program
  expect: answered

- id: A07
  question: What are the tipping-off restrictions?
  category: reporting
  expect: answered

- id: A08
  question: Is gold bullion a precious metal under the Act?
  category: definitions
  expect: answered
  notes: Section 5A. Good demo question — narrow, verifiable, surprising.

- id: A09
  question: What is ongoing customer due diligence?
  category: cdd
  expect: answered

- id: A10
  question: What must a reporting entity do before providing a designated service?
  category: cdd
  expect: answered

- id: T01
  question: What does our SOP say about onboarding a trust client?
  category: tenant
  tenant: meridian
  expect: answered
  must_cite_doc: sop
  notes: THE differentiating moment. Must cite SOP 14, not the Act.

- id: T02
  question: Who do we escalate unusual activity to?
  category: tenant
  tenant: meridian
  expect: answered
  must_cite_doc: sop

- id: T03
  question: What is our record retention period?
  category: tenant
  tenant: meridian
  expect: answered
